# Publish workflow for multi-account-supabase-mcp.
#
# WRITTEN, NOT RUN. This workflow must not publish from this repository now.
# It publishes only from a published release whose tag equals the version in package.json.
# It has no push trigger. The version bump commit carries [skip ci], which GitHub uses to skip
# every workflow on that commit, so a push to main cannot start this workflow. A version bump
# is followed by a release, and the release is the only trigger.
# It publishes only when both of these hold:
#   1. The repository is FiredMosquito831/multi-account-supabase-mcp (the `if:` on the jobs).
#   2. The maintainer has created the trusted publisher on npmjs.com. That is not done yet.
# Creating a published release is the maintainer's go-ahead for the publish that it starts.
# The workflow checks the repository and the tag only. It does not check the npm registry,
# the trusted publisher, or the licence.
# The first publish is the maintainer's, from a terminal (see docs/RELEASING.md).
# This workflow does not replace that step.
#
# No npm token and no secret is used. The publish job uses npm trusted publishing
# (OIDC, with id-token: write) and npm 11.5.1, pinned. Every uses: line is pinned to a
# full commit SHA, with the same pins as ci.yml.

name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Pack dry run
        run: npm pack --dry-run

  check-version:
    name: Check that the release tag is the version
    if: github.repository == 'FiredMosquito831/multi-account-supabase-mcp'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Decide whether this run publishes
        id: decide
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          new_version="$(node -p "require('./package.json').version")"
          publish=false
          if [ "$RELEASE_TAG" = "$new_version" ]; then
            publish=true
          else
            echo "Release tag '$RELEASE_TAG' is not the version in package.json ('$new_version'). Not publishing." >&2
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version in package.json: $new_version. Publish: $publish."

  publish:
    name: Publish to npm
    needs: [check-version, test]
    if: github.repository == 'FiredMosquito831/multi-account-supabase-mcp' && needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install npm 11.5.1 (pinned, for trusted publishing)
        run: npm install -g npm@11.5.1
      - name: Install dependencies
        run: npm ci
      - name: Publish with provenance
        run: npm publish --provenance
